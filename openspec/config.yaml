schema: spec-driven

context: |
  Tech stack: Quarkus 3.39 (Gradle Kotlin DSL, Java 25), Quarkus REST + Jackson,
  ArC (CDI), Qute, Lombok, MapStruct. Base package: dev.abbah.
  Tests: @QuarkusTest + RestAssured in src/test; @QuarkusIntegrationTest classes in
  src/native-test extend the JVM test (XxxIT extends XxxTest).

  Architecture & package layout:
    - Hexagonal (Ports & Adapters). Organize production code under
      src/main/java/dev/abbah/ into two layers, domain/ and infra/:

      src/main/java/dev/abbah/
      ├── domain/
      │   └── <domain_name>/
      │       ├── <Domain>.java              # Domain object (record)
      │       ├── <Domain>Usecase.java       # Business logic (@ApplicationScoped)
      │       ├── <Domain>Port.java          # Port interface (driven)
      │       ├── <Domain><Qualifier>Port.java  # Optional additional port (driven)
      │       └── <Something>Exception.java  # Optional outcome reported by an adapter
      └── infra/
          ├── spi/                           # Driven adapters (outbound)
          │   ├── template/<domain_name>/
          │   │   └── <Domain>Renderer.java      # Text rendering (implements <Domain>RendererPort)
          │   ├── db/<domain_name>/
          │   │   ├── <Domain>Entity.java        # Persistence entity
          │   │   ├── <Domain>EntityMapper.java  # MapStruct (entity ↔ domain)
          │   │   └── <Domain>Adapter.java       # Implements <Domain>Port
          │   ├── rest/<system>/<domain_name>/
          │   │   ├── <Domain>Client.java        # REST client interface
          │   │   ├── <Domain>Payload.java       # Wire request/response records
          │   │   ├── <Domain>PayloadMapper.java # MapStruct (payload ↔ domain)
          │   │   └── <Domain>Adapter.java       # Implements <Domain>Port
          │   └── messaging/<domain_name>/
          │       ├── <Domain>Producer.java      # Event producer (implements Port)
          │       ├── <Domain>Event.java         # Outbound event (record)
          │       └── <Domain>EventMapper.java   # MapStruct (event ↔ domain)
          └── api/                           # Driving adapters (inbound)
              ├── rest/<domain_name>/
              │   ├── <Domain>Resource.java      # Jakarta REST resource
              │   ├── <Domain>DtoMapper.java     # MapStruct (DTO ↔ domain)
              │   └── <Domain>Dto.java           # Request/response DTOs (records)
              └── messaging/<domain_name>/
                  ├── <Domain>Consumer.java      # Event consumer
                  ├── <Domain>Event.java         # Inbound event (record)
                  └── <Domain>EventMapper.java   # MapStruct (event ↔ domain)

    - Domain (domain/<domain_name>/): pure business logic, no infrastructure
      dependencies. Only CDI annotations (jakarta.enterprise.context.*,
      jakarta.inject.*) are allowed, on the use case. Each domain package contains
      <Domain>.java (record), <Domain>Usecase.java (@ApplicationScoped, depends on
      <Domain>Port), and <Domain>Port.java (driven/outbound port interface).
      A domain may declare additional outbound ports named <Domain><Qualifier>Port
      (e.g. AuthorizationRequestRendererPort) when a separate adapter implements them.
      A domain may also declare unchecked exception types named <Something>Exception
      (e.g. UnknownRequesterException) for outcomes that outbound adapters report
      and inbound adapters map to responses.
    - Infra (infra/): all infrastructure adapters, split by direction. New adapter
      technologies go in infra/spi/<technology>/<domain_name>/ (driven/outbound)
      or infra/api/<protocol>/<domain_name>/ (driving/inbound):
        - infra/spi/template/<domain_name>/ — text rendering (outbound):
          <Domain>Renderer.java (@ApplicationScoped, implements <Domain>RendererPort)
          renders text with Qute. Its templates live in
          src/main/resources/templates/<Domain>Renderer/.
        - infra/spi/db/<domain_name>/ — database (outbound): <Domain>Entity.java,
          <Domain>EntityMapper.java (entity ↔ domain), <Domain>Adapter.java
          (@ApplicationScoped, implements <Domain>Port).
        - infra/spi/rest/<system>/<domain_name>/ — external REST API (outbound).
          <system> names that system in lowercase (e.g. salesforce):
          <Domain>Client.java (Quarkus REST client interface), <Domain>Payload.java
          (wire request/response records), <Domain>PayloadMapper.java
          (payload ↔ domain), <Domain>Adapter.java (@ApplicationScoped, implements
          <Domain>Port, calls the client and converts its failures into domain
          exceptions).
        - infra/spi/messaging/<domain_name>/ — messaging producer (outbound, e.g.
          Quarkus Messaging Emitter): <Domain>Producer.java implementing the Port,
          <Domain>Event.java (outbound payload record), <Domain>EventMapper.java.
        - infra/api/rest/<domain_name>/ — REST (inbound): <Domain>Resource.java
          (@Path resource calling the use case), <Domain>DtoMapper.java (DTO ↔ domain),
          <Domain>Dto.java (request/response DTOs).
        - infra/api/messaging/<domain_name>/ — messaging consumer (inbound, e.g.
          @Incoming): <Domain>Consumer.java, <Domain>Event.java (inbound payload
          record), <Domain>EventMapper.java.
    - <domain_name> is the feature domain name in lowercase (e.g. checklist);
      <Domain> is its UpperCamelCase form (checklist → Checklist).
    - File naming convention, for domain checklist:
      Checklist, ChecklistUsecase, ChecklistPort, ChecklistEntity,
      ChecklistEntityMapper, ChecklistAdapter, ChecklistResource, ChecklistDto,
      ChecklistDtoMapper, ChecklistProducer, ChecklistConsumer, ChecklistEvent,
      ChecklistEventMapper, ChecklistRenderer, ChecklistRendererPort, ChecklistClient,
      ChecklistPayload, ChecklistPayloadMapper.
    - Dependencies flow inward (infra → domain): the domain layer never imports
      from infra, so business logic stays free of infrastructure concerns.
    - Cross-layer mapping uses MapStruct with the CDI component model (set by the
      build via -Amapstruct.defaultComponentModel=cdi); inject mappers, never use
      Mappers.getMapper(...).
    - Domain objects, DTOs, event payloads, and REST payloads are Java records. Use
      a class only with a documented reason (e.g. a JPA/Hibernate entity, which must
      be a mutable class). A sealed interface grouping nested records is also an accepted form
      for <Domain>.java and <Domain>Dto.java, when a type has variants that share
      few fields. An interface grouping nested records is the form for
      <Domain>Payload.java.

rules:
  tasks:
    - Implementation tasks follow the /tdd skill (red → green, vertical slices).
    - The first task group lists the public interfaces (seams) under test and gets
      the user's confirmation before any test is written. No task may test at a seam
      not listed there.
    - >-
      Each slice is one seam, one behavior. Write it as a pair of tasks: "RED: write a
      failing test for <behavior> at <seam>", then "GREEN: minimal implementation to
      pass it". Never group several tests ahead of the code they cover.
    - Tests verify behavior through public interfaces (e.g. REST endpoints, use case
      methods), not internals. No mocking of internal collaborators.
    - Keep refactoring out of slices. Put it in a final, separate review
      group after all slices are green.
    - Config, docs, and generated code are exempt from TDD and may be plain tasks.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
