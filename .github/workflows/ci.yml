name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6

      # JVM tests, then the ITs against the packaged jar. Dev Services use the runner's Docker.
      # testNative alone would build and test a native executable: reuse the jar from build instead.
      - run: ./gradlew build
      - run: ./gradlew testNative -x quarkusBuild -Dquarkus.native.enabled=false

      # The image is built after the tests, in a build that skips them: in a build that also produces an image,
      # testNative would run the ITs against the container (see CLAUDE.md). Still compiles, so NullAway still runs.
      - name: Push the image and generate the manifest
        if: github.event_name == 'push'
        run: >
          ./gradlew build -x test -x testNative
          -Dquarkus.container-image.push=true
          -Dquarkus.container-image.tag=${{ github.sha }}
        env:
          QUARKUS_CONTAINER_IMAGE_USERNAME: ${{ github.actor }}
          QUARKUS_CONTAINER_IMAGE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: kubernetes-manifest
          path: build/kubernetes/
          if-no-files-found: error

  deploy-staging:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: kubernetes-manifest
          path: build/kubernetes/
      - name: Write the kubeconfig
        run: |
          printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
      - run: kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/overlays/staging | kubectl apply -f -
      - run: kubectl rollout status deployment/quarkus-template -n staging --timeout=5m

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: kubernetes-manifest
          path: build/kubernetes/
      - name: Write the kubeconfig
        run: |
          printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
      - run: kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/overlays/production | kubectl apply -f -
      - run: kubectl rollout status deployment/quarkus-template -n production --timeout=5m
