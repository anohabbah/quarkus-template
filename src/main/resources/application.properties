quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none

# Salesforce Apex REST endpoint (production sets these through environment variables)
quarkus.rest-client.salesforce.url=${SALESFORCE_URL}
# AuthorizationRequestClient.submit makes up to 3 attempts of at most 7 s each (@Timeout), 250-750 ms apart:
# 3 x 7 + 2 x 0.75 = 22.5 s at worst, under the caller's 30 s timeout. These timeouts keep each attempt inside its 7 s.
# To tune the attempts, edit the annotations or set quarkus.fault-tolerance.global.*: the per-method key names the generated bean class.
quarkus.rest-client.salesforce.connect-timeout=2000
quarkus.rest-client.salesforce.read-timeout=5000

# OAuth client credentials against the Salesforce token endpoint
quarkus.oidc-client.auth-server-url=${SALESFORCE_URL}
quarkus.oidc-client.discovery-enabled=false
quarkus.oidc-client.token-path=/services/oauth2/token
quarkus.oidc-client.client-id=${SALESFORCE_CLIENT_ID}
quarkus.oidc-client.credentials.secret=${SALESFORCE_CLIENT_SECRET}
quarkus.oidc-client.grant.type=client
quarkus.oidc-client.early-tokens-acquisition=false
# At most 2 connect tries x 2 s for a token, well inside the 7 s attempt. The only retry for an unreachable token endpoint.
quarkus.oidc-client.connection-timeout=2S
quarkus.oidc-client.connection-retry-count=1
# Salesforce token responses carry no expires_in: refresh well within the shortest org session timeout
quarkus.oidc-client.access-token-expires-in=15M
# A 401 from Salesforce (e.g. a revoked session) makes the next call fetch a new token instead of the cached one
quarkus.rest-client-oidc-filter.refresh-on-unauthorized=true
